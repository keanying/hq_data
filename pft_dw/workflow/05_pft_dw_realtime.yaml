# 由 generator/make_all.py 生成，请勿手改。调度器无关的工作流定义，可转 DolphinScheduler / Airflow / Azkaban
workflow: pft_dw_realtime
name: PFT 2.0 数仓 · 实时作业
schedule:
  cron: 常驻
  timezone: Asia/Shanghai
  description: Flink 作业 7×24 运行，监控项每分钟采集
  sla: 端到端延迟 ≤ 1 分钟
tasks:
- name: dq.flink_job_inv_realtime_stock
  type: MONITOR
  desc: 作业 flink_job_inv_realtime_stock 运行监控：Flink 作业：读 ods_inv_inventory_pool_rt、ods_inv_inventory_unit_rt；写 ads_inv_realtime_stock_rt、dwd_inv_pool_change_rt、dws_inv_sku_stock_rt
  on_fail: 告警
  rules:
  - id: R1428
    dimension: 及时性
    name: Checkpoint 成功
    level: 强
    expect: 连续 3 次失败或单次 > 5 分钟告警
    sql: Flink 指标：numberOfFailedCheckpoints、lastCheckpointDuration
  - id: R1429
    dimension: 及时性
    name: 无持续反压
    level: 弱
    expect: 任一算子 > 500 持续 5 分钟告警
    sql: Flink 指标：backPressuredTimeMsPerSecond
- name: dq.flink_job_opr_risk_alert
  type: MONITOR
  desc: 作业 flink_job_opr_risk_alert 运行监控：Flink 作业：读 ods_opr_risk_event_rt、ods_ord_entitlement_rt、ods_ord_verify_record_rt；写 ads_opr_risk_alert_rt、ads_ord_realtime_flow_rt、dwd_opr_risk_event_rt、dwd_ord_verify_rt、dws_opr_risk_rule_hit_rt、dws_ord_verify_point_flow_rt
  on_fail: 告警
  rules:
  - id: R1432
    dimension: 及时性
    name: Checkpoint 成功
    level: 强
    expect: 连续 3 次失败或单次 > 5 分钟告警
    sql: Flink 指标：numberOfFailedCheckpoints、lastCheckpointDuration
  - id: R1433
    dimension: 及时性
    name: 无持续反压
    level: 弱
    expect: 任一算子 > 500 持续 5 分钟告警
    sql: Flink 指标：backPressuredTimeMsPerSecond
- name: dq.flink_job_ord_realtime_sales
  type: MONITOR
  desc: 作业 flink_job_ord_realtime_sales 运行监控：Flink 作业：读 ods_fin_payment_record_rt、ods_ord_order_group_rt、ods_ord_order_rt、ods_ord_refund_order_rt；写 ads_ord_realtime_sales_rt、dwd_fin_payment_rt、dwd_ord_order_rt、dwd_ord_refund_rt、dws_ord_tenant_sku_trade_rt
  on_fail: 告警
  rules:
  - id: R1430
    dimension: 及时性
    name: Checkpoint 成功
    level: 强
    expect: 连续 3 次失败或单次 > 5 分钟告警
    sql: Flink 指标：numberOfFailedCheckpoints、lastCheckpointDuration
  - id: R1431
    dimension: 及时性
    name: 无持续反压
    level: 弱
    expect: 任一算子 > 500 持续 5 分钟告警
    sql: Flink 指标：backPressuredTimeMsPerSecond
