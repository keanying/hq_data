  desc: 游客个人凭证
  command: 'sync/ods/ods_cus_customer_credential_di.json  # 源 pft-identity.t_customer_credential → ods.ods_cus_customer_credential_di'
  depends_on:
  - start.daily
  retries: 3
  timeout_minutes: 60
  priority: 中
