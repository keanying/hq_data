- name: dq.ods_cus_customer_credential_di
  type: DATA_QUALITY
  desc: 游客个人凭证 质检
  depends_on:
  - ods_cus_customer_credential_di
  on_fail: 告警
  rules:
  - id: R0099
    dimension: 完整性
    name: 当日分区有数据
    level: 弱
    expect: cnt > 0
    sql: SELECT COUNT(*) AS cnt FROM ods.ods_cus_customer_credential_di WHERE travel_date = '${bizdate}';
  - id: R0100
    dimension: 一致性
    name: 与业务库行数对账
    level: 弱
    expect: '|数仓 − 源端| / 源端 ≤ 0.1%'
    sql: |-
      -- MySQL 源端（pft-identity）
      SELECT COUNT(*) FROM `pft-identity`.t_customer_credential WHERE update_time >= '${bizdate_begin}' AND update_time < '${bizdate_end}';
      -- 数仓端
      SELECT COUNT(DISTINCT id) FROM ods.ods_cus_customer_credential_di WHERE travel_date = '${bizdate}';
