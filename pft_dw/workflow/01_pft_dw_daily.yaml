  - id: R1000
    dimension: 唯一性
    name: 主键/粒度唯一（sku_id + pool_no + play_date + room_type_code + show_time）
    level: 强
    expect: dup_cnt = 0
    sql: |-
      SELECT COUNT(*) AS dup_cnt FROM (
        SELECT sku_id, pool_no, play_date, room_type_code, show_time, COUNT(*) AS c FROM dws.dws_inv_sku_stock_df WHERE travel_date = '${bizdate}' GROUP BY sku_id, pool_no, play_date, room_type_code, show_time HAVING COUNT(*) > 1
      ) x;
  - id: R1001
    dimension: 完整性
    name: 主键/粒度键非空
    level: 强
    expect: null_cnt = 0
    sql: SELECT COUNT(*) AS null_cnt FROM dws.dws_inv_sku_stock_df WHERE travel_date = '${bizdate}' AND (sku_id IS NULL OR pool_no IS NULL OR play_date IS NULL OR room_type_code IS NULL OR show_time IS
      NULL);
