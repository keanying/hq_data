# 由 generator/make_all.py 生成，请勿手改。调度器无关的工作流定义，可转 DolphinScheduler / Airflow / Azkaban
workflow: pft_dw_daily
name: PFT 2.0 数仓 · 日调度
schedule:
  cron: 0 30 0 * * ?
  timezone: Asia/Shanghai
  description: 每日 00:30 启动，处理 T-1（${bizdate}）数据
  sla: ADS 07:30 前就绪
params:
  bizdate: '${yyyyMMdd-1}  # 业务日期 T-1，格式 YYYYMMDD'
  bizdate_begin: ${yyyy-MM-dd-1} 00:00:00
  bizdate_end: ${yyyy-MM-dd} 00:00:00
  bizdate_minus_7: ${yyyyMMdd-8}
policy:
  dq_strong_fail: 阻断：质检节点失败，下游不启动，电话 + 群告警
  dq_weak_fail: 告警：质检节点成功，推送告警到数据群，24 小时内处理
  task_retry: ODS 重试 3 次、其余 2 次，间隔 5 分钟
  backfill: 补数按依赖顺序重跑，质检同样执行
tasks:
- name: start.daily
  type: CHECK
  desc: 源库就绪检查：检查 18 个业务库 T-1 数据已完结：增量同步位点越过 ${bizdate_end}，源库主从延迟 < 60 秒
- name: ods_cus_customer_credential_di
