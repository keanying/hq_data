- name: dq.ods_fin_account_df
  type: DATA_QUALITY
  desc: 统一账户 质检
  depends_on:
  - ods_fin_account_df
  on_fail: 阻断下游
  rules:
  - id: R0031
    dimension: 完整性
    name: 当日分区有数据
    level: 弱
    expect: cnt > 0
    sql: SELECT COUNT(*) AS cnt FROM ods.ods_fin_account_df WHERE travel_date = '${bizdate}';
  - id: R0032
    dimension: 一致性
    name: 与业务库行数对账
    level: 弱
    expect: 数仓 = 源端
    sql: |-
      -- MySQL 源端（pft-finance，抽数时刻快照）
      SELECT COUNT(*) FROM `pft-finance`.t_account;
      -- 数仓端
      SELECT COUNT(*) FROM ods.ods_fin_account_df WHERE travel_date = '${bizdate}';
  - id: R0033
    dimension: 唯一性
    name: 主键/粒度唯一（id）
    level: 强
    expect: dup_cnt = 0
    sql: |-
      SELECT COUNT(*) AS dup_cnt FROM (
        SELECT id, COUNT(*) AS c FROM ods.ods_fin_account_df WHERE travel_date = '${bizdate}' GROUP BY id HAVING COUNT(*) > 1
      ) x;
  - id: R0034
    dimension: 完整性
    name: 主键/粒度键非空
    level: 强
    expect: null_cnt = 0
    sql: SELECT COUNT(*) AS null_cnt FROM ods.ods_fin_account_df WHERE travel_date = '${bizdate}' AND (id IS NULL);
