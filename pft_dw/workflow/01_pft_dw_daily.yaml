      LEFT JOIN dim.dim_inv_pool_df d ON f.pool_no = d.pool_no AND d.travel_date = '${bizdate}'
      WHERE f.travel_date = '${bizdate}' AND f.pool_no IS NOT NULL AND CAST(f.pool_no AS STRING) NOT IN ('0', '');
