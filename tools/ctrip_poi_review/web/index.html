<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 携程图片 CDN 不认本地页面的 Referer，统一不带 -->
<meta name="referrer" content="no-referrer">
<title>景区 POI 数据工作台</title>
<link rel="stylesheet" href="/web/vendor/semi.min.css">
<link rel="stylesheet" href="/web/vendor/semi-icons.min.css">
<!-- layui 图标字体：@font-face 必须在主页面声明，核对面板（shadow DOM）里才能用 -->
<link rel="stylesheet" href="/web/vendor/layui-icons.css">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>
<div id="root"><div class="boot">加载中…</div></div>
<script>
  // 页面没能启动时显示原因（而不是一直「加载中…」）
  (function () {
    function show(msg) {
      var b = document.querySelector('#root .boot');
      if (b) b.innerHTML = '页面加载失败：' + msg + '<br>请按 Ctrl+F5 强制刷新；仍不行请把这段文字发给开发。';
    }
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && (t.src || t.href)) show('文件没能加载 ' + (t.src || t.href)); else show(e.message || String(e));
    }, true);
    setTimeout(function () {
      if (document.querySelector('#root .boot')) {
        var miss = ['React', 'ReactDOM', 'htm', 'SemiUI', 'SemiIcons'].filter(function (k) { return !window[k]; });
        show(miss.length ? '前端库没加载成功：' + miss.join('、') : '启动超时');
      }
    }, 20000);
  })();
</script>
<script src="/web/vendor/react.production.min.js"></script>
<script src="/web/vendor/react-dom.production.min.js"></script>
<script src="/web/vendor/htm.umd.js"></script>
<script src="/web/vendor/semi-icons.min.js"></script>
<script src="/web/vendor/semi-ui.min.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
