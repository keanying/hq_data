<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>携程 POI 核对 / 景点图像采集</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
  body { margin: 0; background: #f6f8fa; color: #1f2328; font-size: 13px; }
  header { background: #fff; border-bottom: 1px solid #d0d7de; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; }
  header .muted { margin-left: auto; }
  main { padding: 16px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1500px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 12px 14px; min-width: 0; }
  .card h2 { font-size: 14px; margin: 0 0 10px; }
  .wide { grid-column: 1 / 3; }
  .muted { color: #57606a; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #eaeef2; white-space: nowrap; }
  th { color: #57606a; font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .bar { height: 6px; background: #eaeef2; border-radius: 3px; overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; background: #1f883d; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
  form label { display: flex; align-items: center; gap: 4px; }
  input, select { font-size: 12px; padding: 4px 6px; border: 1px solid #d0d7de; border-radius: 6px; }
  input[type=number] { width: 70px; }
  button { font-size: 12px; padding: 5px 10px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; }
  button.primary { background: #1f883d; border-color: #1a7f37; color: #fff; }
  button:hover { filter: brightness(.97); }
  .st { padding: 0 6px; border-radius: 10px; font-size: 11px; line-height: 18px; display: inline-block; background: #eaeef2; }
  .st.running { background: #ddf4ff; color: #0969da; } .st.done { background: #dafbe1; color: #1a7f37; }
  .st.failed, .st.need_human { background: #ffebe9; color: #cf222e; } .st.cancelled { background: #fff8c5; color: #7d4e00; }
  tr.sel td { background: #f6f8fa; }
  pre { background: #0d1117; color: #e6edf3; padding: 10px; border-radius: 6px; height: 320px; overflow: auto; font-size: 12px; margin: 0; white-space: pre-wrap; word-break: break-all; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
  .grid figure { margin: 0; background: #f6f8fa; border-radius: 6px; overflow: hidden; }
  .grid img { width: 100%; height: 120px; object-fit: cover; display: block; background: #eaeef2; }
  .grid figcaption { font-size: 11px; padding: 4px 6px; color: #57606a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<header>
  <h1>携程 POI 核对 / 景点图像采集</h1>
  <span class="muted" id="health">连接中…</span>
</header>
<main>
  <section class="card">
    <h2>审核进度（approval）</h2>
    <table id="cities"><thead><tr><th>城市</th><th class="num">已审核</th><th class="num">跳过</th><th class="num">景区</th><th></th></tr></thead><tbody></tbody></table>
  </section>
  <section class="card">
    <h2>图片采集</h2>
    <div class="muted" id="img-summary"></div>
    <table id="imgcity"><thead><tr><th>城市</th><th class="num">POI</th><th class="num">图片</th></tr></thead><tbody></tbody></table>
  </section>

  <section class="card wide">
    <h2>新建任务</h2>
    <form id="f-auto">
      <b>自动审核</b>
      <select name="city" class="city-sel"></select>
      <input name="grade" placeholder="等级，如 5A,4A" style="width:110px">
      <input name="q" placeholder="景区名/ID" style="width:110px">
      <label>最多 <input name="limit" type="number" min="0" value="0"> 个景区</label>
      <label><input name="spots" type="checkbox"> 再搜核心景点</label>
      <label><input name="cache_only" type="checkbox"> 只用缓存</label>
      <label><input name="dry_run" type="checkbox"> 试运行（不写库）</label>
      <button class="primary" type="submit">开始</button>
    </form>
    <form id="f-images">
      <b>采集点评图片</b>
      <select name="city" class="city-sel"></select>
      <input name="grade" placeholder="等级，如 5A,4A" style="width:110px">
      <input name="q" placeholder="景区名/ID" style="width:110px">
      <label>每个 POI 最多 <input name="max_pages" type="number" min="1" value="20"> 页</label>
      <label><input name="max_images" type="number" min="0" value="300"> 张</label>
      <label>最多 <input name="limit" type="number" min="0" value="0"> 个 POI</label>
      <label><input name="refresh" type="checkbox"> 已采完的也重采</label>
      <button class="primary" type="submit">开始</button>
    </form>
    <div class="muted">任务按提交顺序逐个执行，共用一个浏览器。遇到登录/验证会停在「需要人工」：在服务打开的浏览器窗口里处理后，重新提交任务即可（已完成的部分不会重做）。</div>
  </section>

  <section class="card">
    <h2>任务</h2>
    <table id="jobs"><thead><tr><th>#</th><th>类型</th><th>状态</th><th>进度</th><th>开始</th><th></th></tr></thead><tbody></tbody></table>
  </section>
  <section class="card">
    <h2>日志 <span class="muted" id="log-title"></span></h2>
    <pre id="log">点左边的任务查看日志</pre>
  </section>

  <section class="card wide">
    <h2>图片预览</h2>
    <form id="f-preview">
      <input name="scenic_id" placeholder="景区ID，如 PFTSCB01001668" style="width:200px">
      <input name="poi_id" placeholder="poiId（可选）" style="width:120px">
      <button type="submit">查看</button>
      <span class="muted" id="preview-info"></span>
    </form>
    <div class="grid" id="grid"></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = async (path, opt) => { const r = await fetch(path, opt); const j = await r.json(); if (!r.ok) throw new Error(j.detail || r.status); return j; };
const STATUS = { queued: '排队中', running: '运行中', done: '完成', failed: '失败', cancelled: '已取消', need_human: '需要人工' };
let selected = null;

async function loadStats() {
  const s = await api('/api/stats');
  const tb = $('#cities tbody'); let ok = 0, sk = 0, n = 0;
  tb.innerHTML = s.cities.map((c) => { ok += +c.reviewed || 0; sk += +c.skipped || 0; n += +c.n || 0;
    const pct = c.n ? (c.reviewed / c.n * 100) : 0;
    return `<tr><td>${esc(c.city || '（未知）')}</td><td class="num">${c.reviewed || 0}</td><td class="num">${c.skipped || 0}</td><td class="num">${c.n}</td><td><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div></td></tr>`; }).join('')
    + `<tr><td><b>合计</b></td><td class="num"><b>${ok}</b></td><td class="num">${sk}</td><td class="num">${n}</td><td class="muted">${n ? (ok / n * 100).toFixed(1) : 0}%</td></tr>`;
  const im = s.images, cr = im.crawl || {};
  $('#img-summary').textContent = `图片 ${im.image_total} 张；POI 采集：完成 ${cr.done || 0}，部分 ${cr.partial || 0}，失败 ${cr.failed || 0}，进行中 ${cr.running || 0}`;
  $('#imgcity tbody').innerHTML = im.by_city.map((c) => `<tr><td>${esc(c.city)}</td><td class="num">${c.poi_qty}</td><td class="num">${c.image_qty}</td></tr>`).join('') || '<tr><td colspan=3 class="muted">还没有图片</td></tr>';
  if (!document.querySelector('.city-sel option')) {
    const opts = '<option value="">全部城市</option>' + s.cities.filter((c) => c.city).map((c) => `<option value="${esc(c.city)}">${esc(c.city)}</option>`).join('');
    document.querySelectorAll('.city-sel').forEach((el) => (el.innerHTML = opts));
  }
}
async function loadJobs() {
  const h = await api('/api/health');
  $('#health').textContent = `当前任务：${h.current_job ? '#' + h.current_job : '无'} · 排队 ${h.queued} · 景区表 ${h.scenic_rows} 行`;
  const js = await api('/api/jobs');
  $('#jobs tbody').innerHTML = js.map((j) => {
    const pct = j.total ? (j.done / j.total * 100) : (j.status === 'done' ? 100 : 0);
    return `<tr data-id="${j.id}" class="${j.id === selected ? 'sel' : ''}"><td>${j.id}</td><td>${esc(j.type_name)}</td>
      <td><span class="st ${j.status}">${STATUS[j.status] || j.status}</span></td>
      <td><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><span class="muted">${j.done}/${j.total || '?'}</span></td>
      <td class="muted">${esc((j.started || j.created || '').slice(5))}</td>
      <td>${['queued', 'running'].includes(j.status) ? `<button data-cancel="${j.id}">取消</button>` : ''}</td></tr>`;
  }).join('') || '<tr><td colspan=6 class="muted">还没有任务</td></tr>';
  if (selected) {
    const j = await api(`/api/jobs/${selected}?tail=400`);
    const pre = $('#log'), atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
    pre.textContent = j.log.join('\n') + (j.error ? '\n\n' + j.error : '');
    $('#log-title').textContent = `#${j.id} ${j.type_name} · ${STATUS[j.status] || j.status}`;
    if (atBottom) pre.scrollTop = pre.scrollHeight;
  }
}
function formParams(form) {
  const p = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    p[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim();
  }
  return p;
}
async function submit(type, form) {
  const j = await api('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, params: formParams(form) }) });
  selected = j.id; loadJobs();
}
$('#f-auto').addEventListener('submit', (e) => { e.preventDefault(); submit('auto_review', e.target).catch((er) => alert(er.message)); });
$('#f-images').addEventListener('submit', (e) => { e.preventDefault(); submit('images', e.target).catch((er) => alert(er.message)); });
$('#jobs').addEventListener('click', async (e) => {
  const c = e.target.closest('[data-cancel]');
  if (c) { await api(`/api/jobs/${c.dataset.cancel}/cancel`, { method: 'POST' }); loadJobs(); return; }
  const tr = e.target.closest('tr[data-id]');
  if (tr) { selected = +tr.dataset.id; loadJobs(); }
});
$('#f-preview').addEventListener('submit', async (e) => {
  e.preventDefault();
  const p = formParams(e.target);
  const r = await api(`/api/images?scenic_id=${encodeURIComponent(p.scenic_id)}&poi_id=${encodeURIComponent(p.poi_id)}&limit=120`);
  $('#preview-info').textContent = `共 ${r.total} 张，显示前 ${r.items.length} 张`;
  $('#grid').innerHTML = r.items.map((x) => `<figure><a href="${esc(x.image_url)}" target="_blank" rel="noopener"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(x.image_thumb_url || x.image_url)}" alt=""></a>
    <figcaption title="${esc(x.record_id)} · ${esc(x.poi_name)} · ${x.width}×${x.height}">${esc(x.poi_name)} · ${x.width}×${x.height}</figcaption></figure>`).join('');
});
loadStats().catch((e) => ($('#health').textContent = '连接失败：' + e.message));
loadJobs();
setInterval(() => loadJobs().catch(() => {}), 2000);
setInterval(() => loadStats().catch(() => {}), 10000);
</script>
</body>
</html>
